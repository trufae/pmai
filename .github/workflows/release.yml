name: Release

on:
  push:
    tags: ["[0-9]*"]

env:
  # Pass the full release tag below so setup-swift does not drop the .0.
  SWIFT_VERSION: "6.4.0"

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
            target: linux-x64
            runner_arch: x86_64
          - os: ubuntu-24.04-arm
            name: Linux arm64
            target: linux-arm64
            runner_arch: aarch64
          - os: macos-26-intel
            name: macOS x64
            target: macos-x64
            runner_arch: x86_64
          - os: macos-26
            name: macOS arm64
            target: macos-arm64
            runner_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      - name: Show Swift version and verify architecture
        run: |
          swift --version
          test "$(uname -m)" = "${{ matrix.runner_arch }}"

      - name: Install Linux static-link dependencies
        if: runner.os == 'Linux'
        run: |
          # Chrome's unrelated apt repository occasionally publishes an index
          # while its Release metadata is still being mirrored. We do not need
          # it for this build, so keep it out of apt-get update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Restore Swift build outputs
        id: build-cache
        uses: ./.github/actions/restore-swift-build
        with:
          profile: ${{ runner.os == 'Linux' && 'linux-static-native-osize' || 'cli-release-native-osize' }}

      - name: Build release CLI
        run: |
          args=(--package-path MaiCore --build-system native --disable-index-store --disable-prefetching --jobs 2 -c release --product pmai -Xswiftc -Osize)
          if [ "${{ matrix.target }}" = "macos-x64" ]; then
            export PMAI_NO_MLX=1
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Select static Foundation modules during compilation as well as linking.
            args+=(--static-swift-stdlib -Xswiftc -static-stdlib)
          fi
          swift build "${args[@]}"
          bin_dir="$(swift build "${args[@]}" --show-bin-path)"
          python3 sys/build-mlx-metal.py --bin-dir "$bin_dir"
          cp "$bin_dir/pmai" pmai
          if [ -f "$bin_dir/mlx.metallib" ]; then cp "$bin_dir/mlx.metallib" .; fi
          strip ${{ runner.os == 'Linux' && '-s' || '-x' }} pmai

      - name: Verify no shared XML or ICU dependencies
        if: runner.os == 'Linux'
        run: |
          ldd ./pmai
          if ldd ./pmai | grep -Ei 'libxml2|libicu|not found'; then
            echo "::error::pmai still depends on XML/ICU shared libraries or has missing dependencies"
            exit 1
          fi

      - name: Exercise Linux release HTTP error handling
        if: runner.os == 'Linux'
        run: python3 test/linux-network-smoke.py ./pmai

      - name: Package CLI
        run: |
          asset="pmai-${{ matrix.target }}.zip"
          zip -j "$asset" ./pmai
          if [ -f ./mlx.metallib ]; then zip -j "$asset" ./mlx.metallib; fi
          unzip -l "$asset"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmai-${{ matrix.target }}
          path: pmai-${{ matrix.target }}.zip
          if-no-files-found: error

  musl-cli:
    name: CLI (Linux musl ${{ matrix.name }})
    env:
      PMAI_NO_MLX: "1"
      PMAI_FORWIROH_PLATFORM: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: x64
            arch: x86_64
            target: linux-x64-musl
          - os: ubuntu-24.04-arm
            name: arm64
            arch: aarch64
            target: linux-arm64-musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Static Linux SDK must exactly match the host Swift toolchain.
      - name: Set up Swift and Static Linux SDK
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true
          sdks: static-linux

      # Fully static: runs on Alpine and other musl distributions as well as
      # on glibc systems too old for the regular Linux build.
      - name: Restore Swift build outputs
        id: build-cache
        uses: ./.github/actions/restore-swift-build
        with:
          profile: linux-musl-native-osize

      - name: Build fully static release CLI
        run: |
          set -eu
          args=(--package-path MaiCore --build-system native --disable-index-store --disable-prefetching --jobs 2 -c release --swift-sdk ${{ matrix.arch }}-swift-linux-musl -Xswiftc -Osize)
          swift build "${args[@]}" --product pmai
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai
          strip -s pmai
          file pmai
          file pmai | grep -q 'statically linked'
          ./pmai --help >/dev/null

      - name: Test native updater and session lifetime
        run: python3 test/update-smoke.py ./pmai

      - name: Verify release networking without AVX
        if: matrix.arch == 'x86_64'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          python3 test/linux-network-smoke.py qemu-x86_64 -cpu Nehalem ./pmai

      - name: Package CLI
        run: |
          asset="pmai-${{ matrix.target }}.zip"
          zip -j "$asset" pmai
          unzip -l "$asset"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmai-${{ matrix.target }}
          path: pmai-${{ matrix.target }}.zip
          if-no-files-found: error

  windows-cli:
    name: CLI (Windows ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            build_arch: amd64
          - os: windows-11-arm
            arch: arm64
            build_arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the installer-based action that the Swift project runs on Windows.
      - name: Set up Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
          build_arch: ${{ matrix.build_arch }}

      - name: Show Swift version
        run: swift --version

      - name: Restore Swift build outputs
        id: build-cache
        uses: ./.github/actions/restore-swift-build
        with:
          profile: windows-release-osize

      - name: Build release CLI without debug information
        run: swift build --package-path MaiCore --configuration release -debug-info-format none --disable-index-store --disable-prefetching --product pmai -Xswiftc -Osize -Xlinker /DEBUG:NONE

      - name: Package Windows beta CLI
        run: ./sys/package-windows.ps1 -Architecture ${{ matrix.arch }}

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmai-windows-${{ matrix.arch }}
          path: pmai-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  ipa:
    name: GUI (iOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select latest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      # Standalone toolchains omit ld, which Xcode needs to link manifests.
      # https://github.com/swiftlang/swift/issues/89035
      - name: Use Xcode's linker with the Swift toolchain
        run: |
          swift_bin="$(dirname "$(xcrun --find swiftc)")"
          if [ ! -e "$swift_bin/ld" ]; then
            sudo ln -s "$(xcrun --toolchain XcodeDefault --find ld)" "$swift_bin/ld"
          fi

      - name: Restore Swift build outputs
        id: build-cache
        uses: ./.github/actions/restore-swift-build
        with:
          profile: ios-xcode
          package: aitest
          rolling: 'true'
          path: |
            aitest/.build
            build/DerivedData/SourcePackages
            build/DerivedData/CompilationCache.noindex

      # Keep releases independent of private signing credentials. The IPA can
      # be signed after download with the user's own Apple identity.
      - name: Build unsigned device app
        run: |
          # Keep the SDK's Metal toolchain alongside the selected Swift compiler.
          swift_toolchain=$TOOLCHAINS
          unset TOOLCHAINS
          xcode_clang=$(xcrun --toolchain XcodeDefault --find clang)
          xcodebuild \
            -project PocketMai.xcodeproj \
            -scheme PocketMai \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            "CC=$xcode_clang" "TOOLCHAINS=$swift_toolchain \$(inherited)" \
            'OTHER_SWIFT_FLAGS=$(inherited) -Xfrontend -enable-cross-import-overlays' \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILER_INDEX_STORE_ENABLE=NO ENABLE_CODE_COVERAGE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -eu
          app=build/DerivedData/Build/Products/Release-iphoneos/PocketMai.app
          test -d "$app"

          package="$RUNNER_TEMP/PocketMai-ipa"
          mkdir -p "$package/Payload"
          ditto "$app" "$package/Payload/PocketMai.app"

          safe_tag=$(printf '%s' "$GITHUB_REF_NAME" \
            | tr -c '[:alnum:]._-' '-')
          asset="PocketMai-$safe_tag.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$package/Payload" "$asset"
          unzip -tqq "$asset"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocketmai-ipa
          path: PocketMai-*.ipa
          if-no-files-found: error

  android-app:
    name: GUI (Android)
    uses: ./.github/workflows/android-app.yml
    with:
      release: true

  release:
    name: Publish GitHub release
    needs: [cli, musl-cli, windows-cli, android-app, ipa]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: Generate CLI and Android APK checksums
        run: |
          cd release-assets
          sha256sum pmai-*.zip PocketMai-Android.apk > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: PocketMai ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
