name: Release

on:
  push:
    tags: ["[0-9]*"]

env:
  SWIFT_VERSION: "6.4.0"

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
            target: linux-x64
            runner_arch: x86_64
          - os: ubuntu-24.04-arm
            name: Linux arm64
            target: linux-arm64
            runner_arch: aarch64
          - os: macos-26-intel
            name: macOS x64
            target: macos-x64
            runner_arch: x86_64
          - os: macos-26
            name: macOS arm64
            target: macos-arm64
            runner_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          check-latest: true

      - name: Show Swift version and verify architecture
        run: |
          swift --version
          test "$(uname -m)" = "${{ matrix.runner_arch }}"

      - name: Install Linux static-link dependencies
        if: runner.os == 'Linux'
        run: |
          # Chrome's unrelated apt repository occasionally publishes an index
          # while its Release metadata is still being mirrored. We do not need
          # it for this build, so keep it out of apt-get update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libxml2-dev

      - name: Build release CLI
        run: |
          args=(--package-path MaiCore -c release --product pmai -Xswiftc -Osize)
          if [ "${{ runner.os }}" = "Linux" ]; then
            args+=(--static-swift-stdlib)
          fi
          swift build "${args[@]}"
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai
          strip -x pmai

      - name: Exercise Linux release HTTP error handling
        if: runner.os == 'Linux'
        run: python3 test/linux-network-smoke.py ./pmai

      - name: Package CLI
        run: |
          asset="pmai-${{ matrix.target }}.zip"
          zip -j "$asset" ./pmai
          unzip -l "$asset"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: pmai-${{ matrix.target }}
          path: pmai-${{ matrix.target }}.zip
          if-no-files-found: error

  musl-cli:
    name: CLI (Linux musl ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: x64
            arch: x86_64
            target: linux-x64-musl
          - os: ubuntu-24.04-arm
            name: arm64
            arch: aarch64
            target: linux-arm64-musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Static Linux SDK must exactly match the host Swift toolchain.
      - name: Set up Swift and Static Linux SDK
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          check-latest: true
          sdks: static-linux

      # Fully static: runs on Alpine and other musl distributions as well as
      # on glibc systems too old for the regular Linux build. swift-tui does
      # not build against musl, so like the Android build this one leaves out
      # the /visual workspace (PMAI_NO_VISUAL).
      - name: Build fully static release CLI
        env:
          PMAI_NO_VISUAL: "1"
        run: |
          set -eu
          args=(--package-path MaiCore -c release --swift-sdk ${{ matrix.arch }}-swift-linux-musl -Xswiftc -Osize)
          swift build "${args[@]}" --product pmai
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai
          strip -s pmai
          file pmai
          file pmai | grep -q 'statically linked'
          ./pmai --help >/dev/null

      - name: Verify release networking without AVX
        if: matrix.arch == 'x86_64'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          python3 test/linux-network-smoke.py qemu-x86_64 -cpu Nehalem ./pmai

      - name: Package CLI
        run: |
          asset="pmai-${{ matrix.target }}.zip"
          zip -j "$asset" pmai
          unzip -l "$asset"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: pmai-${{ matrix.target }}
          path: pmai-${{ matrix.target }}.zip
          if-no-files-found: error

  android-cli:
    name: CLI (Android arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift and Android SDK
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          check-latest: true
          sdks: android

      # Swift Build reads ANDROID_NDK_HOME; 6.4 no longer needs a setup script.
      - name: Install Android NDK 30
        run: |
          curl -fL -o "$RUNNER_TEMP/android-ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"

      - name: Build Android arm64 release CLI
        run: |
          args=(--package-path MaiCore -c release --swift-sdk swift-${SWIFT_VERSION}-RELEASE_android
            --triple aarch64-unknown-linux-android28 --static-swift-stdlib -Xswiftc -Osize)
          swift build "${args[@]}" --product pmai
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai

      - name: Package Android CLI
        run: |
          set -eu
          package="$RUNNER_TEMP/pmai-android-arm64"
          mkdir -p "$package"
          cp pmai "$package/pmai"
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$package/"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -x "$package/pmai"
          (cd "$package" && zip -9 "$GITHUB_WORKSPACE/pmai-android-arm64.zip" pmai libc++_shared.so)
          unzip -l pmai-android-arm64.zip

      - name: Upload Android CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: pmai-android-arm64
          path: pmai-android-arm64.zip
          if-no-files-found: error

  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select latest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          check-latest: true

      # Keep releases independent of private signing credentials. The IPA can
      # be signed after download with the user's own Apple identity.
      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project PocketMai.xcodeproj \
            -scheme PocketMai \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -eu
          app=build/DerivedData/Build/Products/Release-iphoneos/PocketMai.app
          test -d "$app"

          package="$RUNNER_TEMP/PocketMai-ipa"
          mkdir -p "$package/Payload"
          ditto "$app" "$package/Payload/PocketMai.app"

          safe_tag=$(printf '%s' "$GITHUB_REF_NAME" \
            | tr -c '[:alnum:]._-' '-')
          asset="PocketMai-$safe_tag.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$package/Payload" "$asset"
          unzip -tqq "$asset"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: pocketmai-ipa
          path: PocketMai-*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [cli, musl-cli, android-cli, ipa]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: Generate CLI checksums
        run: |
          cd release-assets
          sha256sum pmai-*.zip > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: PocketMai ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
