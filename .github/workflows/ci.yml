name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      terminal-stress:
        description: Run the 80-agent terminal stress test
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pass the full release tag below so setup-swift does not drop the .0.
  SWIFT_VERSION: "6.4.0"

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
          - os: ubuntu-24.04-arm
            name: Linux arm64
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      - name: Show Swift version
        id: swift-cache
        run: |
          swift --version | tee "$RUNNER_TEMP/swift-cache.txt"
          if [ "$RUNNER_OS" = macOS ]; then
            xcodebuild -version >> "$RUNNER_TEMP/swift-cache.txt"
            xcrun --sdk macosx --show-sdk-version >> "$RUNNER_TEMP/swift-cache.txt"
          fi
          echo "id=$(shasum -a 256 "$RUNNER_TEMP/swift-cache.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Reuse Swift build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: MaiCore/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache.outputs.id }}-${{ hashFiles('MaiCore/Package.swift', 'MaiCore/Package.resolved', 'Vendor/Forwiroh/Package.swift', 'Vendor/Forwiroh/Artifacts/manifest.json') }}-${{ hashFiles('MaiCore/Sources/**', 'MaiCore/Tests/**') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache.outputs.id }}-${{ hashFiles('MaiCore/Package.swift', 'MaiCore/Package.resolved', 'Vendor/Forwiroh/Package.swift', 'Vendor/Forwiroh/Artifacts/manifest.json') }}-

      - name: Test dependency download profiles
        run: python3 test/build-dependencies.py

      - name: Test MaiCore
        if: matrix.name == 'macOS'
        run: python3 test/run-tests.py unit

      # Reuse the debug objects built by swift test on macOS.
      - name: Build debug CLI
        run: |
          args=(--package-path MaiCore --disable-index-store --disable-prefetching)
          if [ "$RUNNER_OS" = Linux ]; then args+=(--jobs 2); fi
          swift build "${args[@]}" --product pmai
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai

      - name: Test platform compatibility and CLI defaults
        run: python3 test/run-tests.py platform --skip-build --binary ./pmai --jobs 2

      - name: Test skills, tool policy, context and terminal colors
        if: matrix.name == 'macOS'
        run: |
          python3 test/repl-skills-smoke.py ./pmai
          python3 test/repl-tool-policy-smoke.py ./pmai
          python3 test/repl-tool-context-smoke.py ./pmai
          python3 test/repl-colors-smoke.py ./pmai

      - name: Test REPL suspend, resume and model discovery
        if: matrix.name == 'Linux x64'
        run: |
          python3 test/repl-suspend-smoke.py ./pmai
          python3 test/repl-models-smoke.py ./pmai

      - name: Test REPL queue choices
        if: matrix.name == 'Linux x64'
        run: |
          python3 test/repl-queue-smoke.py ./pmai
          python3 test/repl-then-smoke.py ./pmai

      - name: Test recursive agents and REPL trees
        if: matrix.name == 'Linux x64'
        run: python3 test/repl-agents-smoke.py ./pmai

      - name: Stress test concurrent agents in the terminal
        if: matrix.name == 'Linux x64' && inputs.terminal-stress
        run: python3 test/repl-subagent-load-smoke.py ./pmai

  static-cli:
    name: CLI (Linux static ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: x64
          - os: ubuntu-24.04-arm
            name: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      - name: Show Swift version
        run: swift --version

      - name: Install static link dependencies
        run: |
          # Chrome's unrelated apt repository occasionally publishes an index
          # while its Release metadata is still being mirrored. We do not need
          # it for this build, so keep it out of apt-get update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      # Links the Swift runtime, Foundation and libdispatch into the
      # executable so it runs on machines without a Swift toolchain. The
      # result still depends on glibc, libstdc++ and libcurl. The musl-cli job
      # below produces the fully static binary for Alpine and other musl distributions.
      - name: Build static debug CLI
        run: |
          # Swift Build also needs static modules while compiling so Foundation
          # emits its CoreFoundation and networking autolink dependencies.
          args=(--package-path MaiCore --disable-prefetching --jobs 2 --static-swift-stdlib -Xswiftc -static-stdlib)
          swift build "${args[@]}" --disable-index-store --product pmai
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai

      - name: Verify no Swift runtime or XML dependencies
        run: |
          set -eu
          bin=./pmai
          file "$bin"
          ldd "$bin"
          if ldd "$bin" | grep -Ei 'libswift|libFoundation|libdispatch|libBlocksRuntime|libxml2|libicu|not found'; then
            echo "::error::pmai still depends on Swift/XML shared libraries or has missing dependencies"
            exit 1
          fi
          "$bin" --help

      - name: Verify Ubuntu 26.04 compatibility
        run: |
          docker run --rm -v "$PWD:/work:ro" ubuntu:26.04 sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends libcurl4t64 libstdc++6 ca-certificates
            /work/pmai --help
          '

      - name: Test document import and XML handling
        run: python3 test/run-tests.py documents

  musl-cli:
    name: CLI (Linux musl ${{ matrix.name }})
    env:
      PMAI_NO_MLX: "1"
      PMAI_FORWIROH_PLATFORM: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: x64
            arch: x86_64
            build-args: -c release -Xswiftc -Osize
          - os: ubuntu-24.04-arm
            name: arm64
            arch: aarch64
            build-args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Static Linux SDK must exactly match the host Swift toolchain.
      - name: Set up Swift and Static Linux SDK
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true
          sdks: static-linux

      # Fully static: no glibc, libstdc++, libcurl or libxml2 dependency, so
      # the same binary runs on Alpine and on every glibc distribution.
      # Keep one optimized build to exercise the SDK/runtime without AVX.
      - name: Build fully static CLI
        run: |
          args=(--package-path MaiCore --disable-prefetching --jobs 2 --swift-sdk ${{ matrix.arch }}-swift-linux-musl ${{ matrix.build-args }})
          swift build "${args[@]}" --disable-index-store --product pmai
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai

      - name: Verify the binary is static and runs
        run: |
          set -eu
          file pmai
          file pmai | grep -q 'statically linked'
          ./pmai --help

      - name: Test paged web fetch over HTTP
        run: python3 test/web-fetch-smoke.py ./pmai

      - name: Test native updater and session lifetime
        run: python3 test/update-smoke.py ./pmai

      # Nehalem has SSE4.2 but no AVX, like the N4120's relevant ISA ceiling.
      # Test the linked SDK/runtime too, not just instructions emitted by pmai.
      - name: Verify release networking without AVX
        if: matrix.arch == 'x86_64'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          python3 test/linux-network-smoke.py qemu-x86_64 -cpu Nehalem ./pmai

  android-cli:
    name: CLI (Android arm64)
    runs-on: ubuntu-24.04
    env:
      PMAI_NO_MLX: "1"
      PMAI_FORWIROH_PLATFORM: native
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Android Swift SDK must exactly match the host Swift toolchain.
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      - name: Install Android NDK 30
        run: |
          curl -fL -o "$RUNNER_TEMP/android-ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          # ROOT takes precedence over HOME, including the runner's preinstalled NDK.
          echo "ANDROID_NDK_ROOT=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"

      - name: Install and configure Swift Android SDK
        run: |
          swift sdk install \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/android-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_android.artifactbundle.tar.gz" \
            --checksum 21fb555122a3d801ad943d48df7ebffdd8824de61c25c180bb792d3edaee0b43
          swiftpm_root="${XDG_CONFIG_HOME:+$XDG_CONFIG_HOME/swiftpm}"
          bash "${swiftpm_root:-$HOME/.swiftpm}/swift-sdks/swift-${SWIFT_VERSION}-RELEASE_android.artifactbundle/swift-android/scripts/setup-android-sdk.sh"

      # Avoid Swift Build 6.4's Linux planner crash and exercise the release flags.
      - name: Build Android arm64 release CLI
        run: |
          swift build --build-system native --package-path MaiCore -c release --disable-index-store --disable-prefetching --product pmai \
            --swift-sdk swift-${SWIFT_VERSION}-RELEASE_android \
            --triple aarch64-unknown-linux-android28 --static-swift-stdlib -Xswiftc -Osize

  windows-cli:
    name: CLI (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the installer-based action that the Swift project runs on Windows.
      - name: Set up Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE

      - name: Show Swift version
        run: swift --version

      - name: Test dependency download profiles
        run: python test/build-dependencies.py

      - name: Build debug CLI
        run: |
          swift build --package-path MaiCore --disable-index-store --disable-prefetching --product pmai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = swift build --package-path MaiCore --disable-prefetching --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$bin/pmai.exe" pmai.exe

      - name: Verify the binary runs
        run: |
          ./pmai.exe --help

      - name: Test paged web fetch over HTTP
        run: python test/web-fetch-smoke.py ./pmai.exe

  build:
    name: Build (Xcode latest on macOS latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select latest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      # Standalone toolchains omit ld, which Xcode needs to link manifests.
      # https://github.com/swiftlang/swift/issues/89035
      - name: Use Xcode's linker with the Swift toolchain
        run: |
          swift_bin="$(dirname "$(xcrun --find swiftc)")"
          if [ ! -e "$swift_bin/ld" ]; then
            sudo ln -s "$(xcrun --toolchain XcodeDefault --find ld)" "$swift_bin/ld"
          fi

      - name: Show Xcode and macOS versions
        id: ios-cache
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m
          {
            swift --version
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
          } > "$RUNNER_TEMP/ios-cache.txt"
          echo "id=$(shasum -a 256 "$RUNNER_TEMP/ios-cache.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Reuse iOS dependencies and compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            aitest/.build
            build/DerivedData/SourcePackages
            build/DerivedData/CompilationCache.noindex
          key: ios-${{ runner.arch }}-${{ steps.ios-cache.outputs.id }}-${{ hashFiles('**/Package.resolved', 'MaiCore/Package.swift', 'Vendor/Forwiroh/Package.swift', 'Vendor/Forwiroh/Artifacts/manifest.json') }}

      - name: List available iOS Simulator runtimes
        run: xcrun simctl list runtimes

      - name: Verify shared aitest tooling
        run: make aitest-build

      - name: Build and run all iOS tests (including conversation compatibility)
        run: |
          # A global override hides the SDK's Metal toolchain. Preserve it via
          # the inherited build setting, with Swift 6.4 first in the search order.
          swift_toolchain=$TOOLCHAINS
          unset TOOLCHAINS
          # Keep Xcode's SDK-integrated Clang for C/C++ dependencies. Coverage
          # instrumentation is unused in CI and slows down their compilation.
          xcode_clang=$(xcrun --toolchain XcodeDefault --find clang)
          # Match Xcode's automatic SwiftUI/PhotosUI cross-imports.
          # https://github.com/swiftlang/swift/issues/73048
          make test XCODE_PACKAGE_FLAGS="-skipPackagePluginValidation -enableCodeCoverage NO COMPILER_INDEX_STORE_ENABLE=NO \
            'CC=$xcode_clang' 'TOOLCHAINS=$swift_toolchain \$\$(inherited)' \
            'OTHER_SWIFT_FLAGS=\$\$(inherited) -Xfrontend -enable-cross-import-overlays'"

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: build/TestResults*.xcresult
          if-no-files-found: ignore
