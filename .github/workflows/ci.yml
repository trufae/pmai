name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pass the full release tag below so setup-swift does not drop the .0.
  SWIFT_VERSION: "6.4.0"

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
          - os: ubuntu-24.04-arm
            name: Linux arm64
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      - name: Show Swift version
        run: swift --version

      - name: Test MaiCore
        if: matrix.name == 'macOS'
        run: swift test --package-path MaiCore

      # Reuse the debug objects built by swift test on macOS.
      - name: Build debug CLI
        run: |
          swift build --package-path MaiCore --product pmai
          cp "$(swift build --package-path MaiCore --show-bin-path)/pmai" pmai

      - name: Test paged web fetch over HTTP
        run: python3 test/web-fetch-smoke.py ./pmai

      - name: Test REPL queue choices
        if: matrix.name == 'Linux x64'
        run: python3 test/repl-queue-smoke.py ./pmai

      - name: Test REPL suspend and resume
        run: python3 test/repl-suspend-smoke.py ./pmai

      - name: Exercise HTTP error handling
        if: runner.os == 'Linux'
        run: python3 test/linux-network-smoke.py ./pmai

  static-cli:
    name: CLI (Linux static ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: x64
          - os: ubuntu-24.04-arm
            name: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      - name: Show Swift version
        run: swift --version

      # Static Foundation links against the system libcurl and libxml2, whose
      # development symlinks are missing on the arm64 runner image.
      - name: Install static link dependencies
        run: |
          # Chrome's unrelated apt repository occasionally publishes an index
          # while its Release metadata is still being mirrored. We do not need
          # it for this build, so keep it out of apt-get update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libxml2-dev

      # Links the Swift runtime, Foundation and libdispatch into the
      # executable so it runs on machines without a Swift toolchain. The
      # result still depends on glibc, libstdc++, libcurl and libxml2, which
      # every mainstream glibc distro ships. The musl-cli job below produces
      # the fully static binary for Alpine and other musl distributions.
      - name: Build static debug CLI
        run: |
          swift build --package-path MaiCore --product pmai --static-swift-stdlib
          cp "$(swift build --package-path MaiCore --static-swift-stdlib --show-bin-path)/pmai" pmai

      - name: Verify no Swift runtime dependencies
        run: |
          set -eu
          bin=./pmai
          file "$bin"
          ldd "$bin"
          if ldd "$bin" | grep -Ei 'libswift|libFoundation|libdispatch|libBlocksRuntime|not found'; then
            echo "::error::pmai still depends on Swift runtime shared libraries"
            exit 1
          fi
          "$bin" --help

  musl-cli:
    name: CLI (Linux musl ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: x64
            arch: x86_64
            build-args: -c release -Xswiftc -Osize
          - os: ubuntu-24.04-arm
            name: arm64
            arch: aarch64
            build-args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Static Linux SDK must exactly match the host Swift toolchain.
      - name: Set up Swift and Static Linux SDK
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true
          sdks: static-linux

      # Fully static: no glibc, libstdc++, libcurl or libxml2 dependency, so
      # the same binary runs on Alpine and on every glibc distribution.
      # swift-tui does not build against musl, so like the Android build this
      # one leaves out the /visual workspace (PMAI_NO_VISUAL).
      # Keep one optimized build to exercise the SDK/runtime without AVX.
      - name: Build fully static CLI
        env:
          PMAI_NO_VISUAL: "1"
        run: |
          args=(--package-path MaiCore --swift-sdk ${{ matrix.arch }}-swift-linux-musl ${{ matrix.build-args }})
          swift build "${args[@]}" --product pmai
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai

      - name: Verify the binary is static and runs
        run: |
          set -eu
          file pmai
          file pmai | grep -q 'statically linked'
          ./pmai --help

      - name: Test paged web fetch over HTTP
        run: python3 test/web-fetch-smoke.py ./pmai

      - name: Test REPL suspend and resume
        run: python3 test/repl-suspend-smoke.py ./pmai

      # Nehalem has SSE4.2 but no AVX, like the N4120's relevant ISA ceiling.
      # Test the linked SDK/runtime too, not just instructions emitted by pmai.
      - name: Verify release networking without AVX
        if: matrix.arch == 'x86_64'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          python3 test/linux-network-smoke.py qemu-x86_64 -cpu Nehalem ./pmai

  android-cli:
    name: CLI (Android arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Android Swift SDK must exactly match the host Swift toolchain.
      - name: Set up Swift and Android SDK
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true
          sdks: android

      # Swift Build reads ANDROID_NDK_HOME; 6.4 no longer needs a setup script.
      - name: Install Android NDK 30
        run: |
          curl -fL -o "$RUNNER_TEMP/android-ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"

      - name: Build Android arm64 debug CLI
        run: |
          swift build --package-path MaiCore --product pmai \
            --swift-sdk swift-${SWIFT_VERSION}-RELEASE_android \
            --triple aarch64-unknown-linux-android28 --static-swift-stdlib

  windows-cli:
    name: CLI (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # swift-tui only builds against Darwin and Glibc, so like the musl and
      # Android builds the Windows CLI leaves out the /visual workspace.
      PMAI_NO_VISUAL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Use the installer-based action that the Swift project runs on Windows.
      - name: Set up Swift
        uses: compnerd/gha-setup-swift@v0.4.1
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE

      - name: Show Swift version
        run: swift --version

      - name: Build debug CLI
        run: |
          swift build --package-path MaiCore --product pmai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = swift build --package-path MaiCore --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$bin/pmai.exe" pmai.exe

      - name: Verify the binary runs
        run: |
          ./pmai.exe --help

      - name: Test paged web fetch over HTTP
        run: python test/web-fetch-smoke.py ./pmai.exe

  build:
    name: Build (Xcode latest on macOS latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      - name: Show Xcode and macOS versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m

      - name: List available iOS Simulator runtimes
        run: xcrun simctl list runtimes

      - name: Verify shared aitest tooling
        run: make aitest-build

      - name: Build and run all iOS tests (including conversation compatibility)
        run: make test

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: build/TestResults*.xcresult
          if-no-files-found: ignore
