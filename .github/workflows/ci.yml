name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
            artifact: pmai-linux-x64
          - os: ubuntu-24.04-arm
            name: Linux arm64
            artifact: pmai-linux-arm64
          - os: macos-latest
            name: macOS
            artifact: pmai-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Test MaiCore
        if: matrix.name == 'macOS'
        run: swift test --package-path MaiCore

      - name: Build release CLI
        run: |
          swift build --package-path MaiCore -c release --product pmai -Xswiftc -Osize
          strip -x MaiCore/.build/release/pmai

      - name: Test REPL queue choices
        if: matrix.name == 'Linux x64'
        run: python3 test/repl-queue-smoke.py MaiCore/.build/release/pmai

      - name: Test REPL suspend and resume
        run: python3 test/repl-suspend-smoke.py MaiCore/.build/release/pmai

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: MaiCore/.build/release/pmai
          if-no-files-found: error

      - name: Exercise release HTTP error handling
        if: runner.os == 'Linux'
        run: python3 test/linux-network-smoke.py MaiCore/.build/release/pmai

  static-cli:
    name: CLI (Linux static ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: x64
            artifact: pmai-linux-x64-static
          - os: ubuntu-24.04-arm
            name: arm64
            artifact: pmai-linux-arm64-static
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      # Static Foundation links against the system libcurl and libxml2, whose
      # development symlinks are missing on the arm64 runner image.
      - name: Install static link dependencies
        run: |
          # Chrome's unrelated apt repository occasionally publishes an index
          # while its Release metadata is still being mirrored. We do not need
          # it for this build, so keep it out of apt-get update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libxml2-dev

      # Links the Swift runtime, Foundation and libdispatch into the
      # executable so it runs on machines without a Swift toolchain. The
      # result still depends on glibc, libstdc++, libcurl and libxml2, which
      # every mainstream glibc distro ships. The musl-cli job below produces
      # the fully static binary for Alpine and other musl distributions.
      - name: Build static release CLI
        run: |
          swift build --package-path MaiCore -c release --product pmai \
            --static-swift-stdlib -Xswiftc -Osize
          strip -s MaiCore/.build/release/pmai

      - name: Verify no Swift runtime dependencies
        run: |
          set -eu
          bin=MaiCore/.build/release/pmai
          file "$bin"
          ldd "$bin"
          if ldd "$bin" | grep -Ei 'libswift|libFoundation|libdispatch|libBlocksRuntime|not found'; then
            echo "::error::pmai still depends on Swift runtime shared libraries"
            exit 1
          fi
          "$bin" --help

      - name: Upload static CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: MaiCore/.build/release/pmai
          if-no-files-found: error

  musl-cli:
    name: CLI (Linux musl ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: x64
            arch: x86_64
            artifact: pmai-linux-x64-musl
          - os: ubuntu-24.04-arm
            name: arm64
            arch: aarch64
            artifact: pmai-linux-arm64-musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Static Linux SDK must exactly match the host Swift toolchain.
      - name: Set up Swift 6.3.3 and Static Linux SDK
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: "6.3.3"
          sdks: static-linux

      # Fully static: no glibc, libstdc++, libcurl or libxml2 dependency, so
      # the same binary runs on Alpine and on every glibc distribution.
      # swift-tui does not build against musl, so like the Android build this
      # one leaves out the /visual workspace (PMAI_NO_VISUAL).
      - name: Build fully static release CLI
        run: |
          PMAI_NO_VISUAL=1 swift build --package-path MaiCore -c release --product pmai \
            --swift-sdk ${{ matrix.arch }}-swift-linux-musl -Xswiftc -Osize
          bin=MaiCore/.build/${{ matrix.arch }}-swift-linux-musl/release/pmai
          strip -s "$bin"
          cp "$bin" pmai

      - name: Verify the binary is static and runs
        run: |
          set -eu
          file pmai
          file pmai | grep -q 'statically linked'
          ./pmai --help

      - name: Test REPL suspend and resume
        run: python3 test/repl-suspend-smoke.py ./pmai

      - name: Upload static musl CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: pmai
          if-no-files-found: error

      # Nehalem has SSE4.2 but no AVX, like the N4120's relevant ISA ceiling.
      # Test the linked SDK/runtime too, not just instructions emitted by pmai.
      - name: Verify release networking without AVX
        if: matrix.arch == 'x86_64'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          python3 test/linux-network-smoke.py qemu-x86_64 -cpu Nehalem ./pmai

  android-cli:
    name: CLI (Android arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Android Swift SDK must exactly match the host Swift toolchain.
      - name: Set up Swift 6.3.3 and Android SDK
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: "6.3.3"
          sdks: android

      - name: Install Android NDK and configure Swift SDK
        run: |
          set -eu
          ndk="$RUNNER_TEMP/android-ndk-r27d"
          curl -fL -o "$RUNNER_TEMP/android-ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          test -d "$ndk"

          swift_sdk_root="${XDG_CONFIG_HOME:-$HOME/.config}/swiftpm/swift-sdks"
          android_sdk="$swift_sdk_root/swift-6.3.3-RELEASE_android.artifactbundle/swift-android"
          setup_script="$android_sdk/scripts/setup-android-sdk.sh"

          echo "Android NDK: $ndk"
          echo "Swift Android SDK: $android_sdk"
          echo "Setup script: $setup_script"
          echo "Swift SDKs installed:"
          swift sdk list

          if [ ! -d "$ndk" ]; then
            echo "::error::Android NDK directory does not exist: $ndk"
            exit 1
          fi
          if [ ! -f "$setup_script" ]; then
            echo "::error::Android SDK setup script does not exist: $setup_script"
            echo "Contents of the Swift SDK installation directory:"
            find "$swift_sdk_root" -maxdepth 4 -print || true
            exit 1
          fi

          echo "NDK and setup-script permissions:"
          ls -ld "$ndk" "$setup_script"
          echo "Starting setup-android-sdk.sh with ANDROID_NDK_HOME=$ndk"
          set +e
          ANDROID_NDK_HOME="$ndk" bash -x "$setup_script"
          setup_status=$?
          set -e
          echo "setup-android-sdk.sh completed with exit code $setup_status"

          if [ "$setup_status" -ne 0 ]; then
            echo "::error::setup-android-sdk.sh failed with exit code $setup_status"
            echo "Host and tool diagnostics:"
            uname -a
            bash --version
            command -V swift curl unzip bash || true
            echo "Relevant environment paths:"
            echo "HOME=$HOME"
            echo "RUNNER_TEMP=$RUNNER_TEMP"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "Android NDK directory structure:"
            find "$ndk" -maxdepth 3 -type d -print || true
            echo "Swift Android SDK directory structure:"
            find "$android_sdk" -maxdepth 3 -print || true
            exit "$setup_status"
          fi

          echo "Android Swift SDK setup completed successfully"

      - name: Build Android arm64 release CLI
        run: |
          swift build --package-path MaiCore -c release --product pmai \
            --swift-sdk aarch64-unknown-linux-android28 --static-swift-stdlib \
            -Xswiftc -Osize

      - name: Stage Android CLI artifact
        run: |
          set -eu
          output="$RUNNER_TEMP/pmai-android-arm64"
          mkdir -p "$output"
          cp MaiCore/.build/aarch64-unknown-linux-android28/release/pmai "$output/pmai"
          cp "$RUNNER_TEMP/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$output/"
          "$RUNNER_TEMP/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -x "$output/pmai"
          file "$output/pmai"
          file "$output/libc++_shared.so"

      - name: Upload Android CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: pmai-android-arm64
          path: ${{ runner.temp }}/pmai-android-arm64
          if-no-files-found: error

  windows-cli:
    name: CLI (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # swift-tui only builds against Darwin and Glibc, so like the musl and
      # Android builds the Windows CLI leaves out the /visual workspace.
      PMAI_NO_VISUAL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Use the installer-based action that the Swift project runs on Windows.
      - name: Set up Swift 6.3.3
        uses: compnerd/gha-setup-swift@v0.4.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Show Swift version
        run: swift --version

      - name: Build release CLI
        run: |
          swift build --package-path MaiCore -c release --product pmai -Xswiftc -Osize

      - name: Verify the binary runs
        run: |
          ./MaiCore/.build/release/pmai.exe --help

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: pmai-windows-x64
          path: MaiCore/.build/release/pmai.exe
          if-no-files-found: error

  build:
    name: Build (Xcode latest on macOS latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Show Xcode and macOS versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m

      - name: List available iOS Simulator runtimes
        run: xcrun simctl list runtimes

      - name: Verify shared aitest tooling
        run: make aitest-build

      - name: Build and run all iOS tests (including conversation compatibility)
        run: make test

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: build/TestResults*.xcresult
          if-no-files-found: ignore
