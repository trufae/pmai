name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      terminal-stress:
        description: Run the 80-agent terminal stress test
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pass the full release tag below so setup-swift does not drop the .0.
  SWIFT_VERSION: "6.4.0"

# Build caches are restored everywhere but saved only from main, so pull
# requests reuse main's objects without evicting them. Each job saves right
# after compilation (including focused test graphs); test failures still
# refresh the cache for the next run.

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
          - os: ubuntu-24.04-arm
            name: Linux arm64
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      - name: Restore Swift build outputs
        id: build-cache
        uses: ./.github/actions/restore-swift-build
        with:
          profile: ${{ runner.os == 'macOS' && 'cli-debug-native' || 'cli-release-native-osize' }}

      - name: Test dependency download profiles
        run: python3 test/build-dependencies.py

      - name: Test MaiCore
        if: matrix.name == 'macOS'
        run: python3 test/run-tests.py unit

      # Reuse the debug objects built by swift test on macOS.
      - name: Build CLI
        run: |
          args=(--package-path MaiCore --disable-index-store --disable-prefetching --build-system native --jobs 2)
          if [ "$RUNNER_OS" = Linux ]; then args+=(-c release -Xswiftc -Osize); fi
          swift build "${args[@]}" --product pmai
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai

      - name: Save Swift build outputs
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: MaiCore/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Test platform compatibility and CLI defaults
        run: python3 test/run-tests.py platform --skip-build --binary ./pmai --jobs 2

      - name: Test skills, tool policy and context
        if: matrix.name == 'macOS'
        run: |
          python3 test/repl-skills-smoke.py ./pmai
          python3 test/repl-tool-policy-smoke.py ./pmai
          python3 test/repl-tool-context-smoke.py ./pmai

      - name: Test REPL suspend, resume and model discovery
        if: matrix.name == 'Linux x64'
        run: |
          python3 test/repl-suspend-smoke.py ./pmai
          python3 test/repl-models-smoke.py ./pmai

      - name: Test REPL queue choices
        if: matrix.name == 'Linux x64'
        run: |
          python3 test/repl-queue-smoke.py ./pmai
          python3 test/repl-then-smoke.py ./pmai

      - name: Test recursive agents and REPL trees
        if: matrix.name == 'Linux x64'
        run: python3 test/repl-agents-smoke.py ./pmai

      - name: Stress test concurrent agents in the terminal
        if: matrix.name == 'Linux x64' && inputs.terminal-stress
        run: python3 test/repl-subagent-load-smoke.py ./pmai

  static-cli:
    name: CLI (Linux static ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: x64
          - os: ubuntu-24.04-arm
            name: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      - name: Show Swift version
        run: swift --version

      - name: Install static link dependencies
        run: |
          # Chrome's unrelated apt repository occasionally publishes an index
          # while its Release metadata is still being mirrored. We do not need
          # it for this build, so keep it out of apt-get update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      # Links the Swift runtime, Foundation and libdispatch into the
      # executable so it runs on machines without a Swift toolchain. The
      # result still depends on glibc, libstdc++ and libcurl. The musl-cli job
      # below produces the fully static binary for Alpine and other musl distributions.
      - name: Restore Swift build outputs
        id: build-cache
        uses: ./.github/actions/restore-swift-build
        with:
          profile: linux-static-native-osize

      - name: Build static release CLI
        run: |
          # Swift Build also needs static modules while compiling so Foundation
          # emits its CoreFoundation and networking autolink dependencies.
          args=(--package-path MaiCore --disable-prefetching --build-system native --jobs 2 -c release -Xswiftc -Osize --static-swift-stdlib -Xswiftc -static-stdlib)
          swift build "${args[@]}" --disable-index-store --product pmai
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai

      - name: Verify no Swift runtime or XML dependencies
        run: |
          set -eu
          bin=./pmai
          file "$bin"
          ldd "$bin"
          if ldd "$bin" | grep -Ei 'libswift|libFoundation|libdispatch|libBlocksRuntime|libxml2|libicu|not found'; then
            echo "::error::pmai still depends on Swift/XML shared libraries or has missing dependencies"
            exit 1
          fi
          "$bin" --help

      - name: Verify Ubuntu 26.04 compatibility
        run: |
          docker run --rm -v "$PWD:/work:ro" ubuntu:26.04 sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends libcurl4t64 libstdc++6 ca-certificates
            /work/pmai --help
          '

      - name: Test document import and XML handling
        run: python3 test/run-tests.py documents

      - name: Save Swift build outputs
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: MaiCore/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  musl-cli:
    name: CLI (Linux musl ${{ matrix.name }})
    env:
      PMAI_NO_MLX: "1"
      PMAI_FORWIROH_PLATFORM: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: x64
            arch: x86_64
          - os: ubuntu-24.04-arm
            name: arm64
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Static Linux SDK must exactly match the host Swift toolchain.
      - name: Set up Swift and Static Linux SDK
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true
          sdks: static-linux

      # Fully static: no glibc, libstdc++, libcurl or libxml2 dependency, so
      # the same binary runs on Alpine and on every glibc distribution.
      # Keep one optimized build to exercise the SDK/runtime without AVX.
      - name: Restore Swift build outputs
        id: build-cache
        uses: ./.github/actions/restore-swift-build
        with:
          profile: linux-musl-native-osize

      - name: Build fully static CLI
        run: |
          args=(--package-path MaiCore --disable-prefetching --build-system native --jobs 2 -c release -Xswiftc -Osize --swift-sdk ${{ matrix.arch }}-swift-linux-musl)
          swift build "${args[@]}" --disable-index-store --product pmai
          cp "$(swift build "${args[@]}" --show-bin-path)/pmai" pmai

      - name: Save Swift build outputs
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: MaiCore/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Verify the binary is static and runs
        run: |
          set -eu
          file pmai
          file pmai | grep -q 'statically linked'
          ./pmai --help

      - name: Test paged web fetch over HTTP
        run: python3 test/web-fetch-smoke.py ./pmai

      - name: Test native updater and session lifetime
        run: python3 test/update-smoke.py ./pmai

      # Nehalem has SSE4.2 but no AVX, like the N4120's relevant ISA ceiling.
      # Test the linked SDK/runtime too, not just instructions emitted by pmai.
      - name: Verify release networking without AVX
        if: matrix.arch == 'x86_64'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          python3 test/linux-network-smoke.py qemu-x86_64 -cpu Nehalem ./pmai

  windows-cli:
    name: CLI (Windows ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            build_arch: amd64
          - os: windows-11-arm
            arch: arm64
            build_arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the installer-based action that the Swift project runs on Windows.
      - name: Set up Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
          build_arch: ${{ matrix.build_arch }}

      - name: Show Swift version
        run: swift --version

      - name: Restore Swift build outputs
        id: build-cache
        uses: ./.github/actions/restore-swift-build
        with:
          profile: windows-release-osize

      - name: Build release CLI without debug information
        run: swift build --package-path MaiCore --configuration release -debug-info-format none --disable-index-store --disable-prefetching --product pmai -Xswiftc -Osize -Xlinker /DEBUG:NONE

      - name: Save Swift build outputs
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: MaiCore/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Check console input and shell tools
        run: |
          $bin = swift build --package-path MaiCore --configuration release --disable-prefetching --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $failed = 0
          foreach ($test in 'windows-console', 'run-shell', 'windows-terminal') {
            python "test/$test-smoke.py" (Join-Path $bin 'pmai.exe')
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed

      - name: Package Windows beta CLI
        run: ./sys/package-windows.ps1 -Architecture ${{ matrix.arch }}

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmai-windows-${{ matrix.arch }}
          path: pmai-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  build:
    name: GUI (iOS)
    runs-on: macos-latest
    # A cold compilation cache needs ~27 minutes just to build.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select latest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-RELEASE
          check-latest: true

      # Standalone toolchains omit ld, which Xcode needs to link manifests.
      # https://github.com/swiftlang/swift/issues/89035
      - name: Use Xcode's linker with the Swift toolchain
        run: |
          swift_bin="$(dirname "$(xcrun --find swiftc)")"
          if [ ! -e "$swift_bin/ld" ]; then
            sudo ln -s "$(xcrun --toolchain XcodeDefault --find ld)" "$swift_bin/ld"
          fi

      - name: Restore Swift build outputs
        id: ios-build-cache
        uses: ./.github/actions/restore-swift-build
        with:
          profile: ios-xcode
          package: aitest
          rolling: 'true'
          path: |
            aitest/.build
            build/DerivedData/SourcePackages
            build/DerivedData/CompilationCache.noindex

      - name: List available iOS Simulator runtimes
        run: xcrun simctl list runtimes

      - name: Verify shared aitest tooling
        run: make aitest-build

      - name: Build and run all iOS tests (including conversation compatibility)
        run: |
          # A global override hides the SDK's Metal toolchain. Preserve it via
          # the inherited build setting, with Swift 6.4 first in the search order.
          swift_toolchain=$TOOLCHAINS
          unset TOOLCHAINS
          # Keep Xcode's SDK-integrated Clang for C/C++ dependencies. Coverage
          # instrumentation is unused in CI and slows down their compilation.
          xcode_clang=$(xcrun --toolchain XcodeDefault --find clang)
          # Match Xcode's automatic SwiftUI/PhotosUI cross-imports.
          # https://github.com/swiftlang/swift/issues/73048
          make test XCODE_PACKAGE_FLAGS="-skipPackagePluginValidation -enableCodeCoverage NO COMPILER_INDEX_STORE_ENABLE=NO \
            'CC=$xcode_clang' 'TOOLCHAINS=$swift_toolchain \$\$(inherited)' \
            'OTHER_SWIFT_FLAGS=\$\$(inherited) -Xfrontend -enable-cross-import-overlays'"

      # Also after failures and timeouts: a cold build alone takes ~27 minutes.
      - name: Save iOS dependencies and compiler cache
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            aitest/.build
            build/DerivedData/SourcePackages
            build/DerivedData/CompilationCache.noindex
          key: ${{ steps.ios-build-cache.outputs.cache-primary-key }}

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: build/TestResults*.xcresult
          if-no-files-found: ignore
