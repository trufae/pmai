name: Pages

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [Release, Android app]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package website
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name != 'Android app' ||
        (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pages always reflects the default branch. A release completion
          # requests a fresh deployment without letting an older tag roll the
          # website back.
          ref: main

      - name: Verify static website
        run: |
          set -eu
          test -f www/index.html
          test -f www/styles.css
          test -f www/app.js
          test -f www/install.sh
          test -f www/mai-logo.png
          test -f www/icon-192.png
          test -f www/pmai-logo-noai.png
          test -f www/swift.svg
          test -x www/install.sh

      - name: Bundle the latest main-branch Kotlin Android release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-app.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          test -n "$run_id" || { echo "No successful main-branch Android build found" >&2; exit 1; }
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "PocketMai-Android-release" and .expired == false) | .id')
          test -n "$artifact_id" || { echo "The Android APK artifact is missing or expired" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/pocketmai-android.zip"
          mkdir -p www/downloads
          unzip -p "$RUNNER_TEMP/pocketmai-android.zip" PocketMai-Android.apk > www/downloads/PocketMai-Android.apk
          test -s www/downloads/PocketMai-Android.apk
          (cd www/downloads && sha256sum PocketMai-Android.apk > PocketMai-Android.apk.sha256)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: www

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
