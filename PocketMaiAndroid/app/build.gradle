plugins { alias(libs.plugins.android.application) }

def releaseSigning = [
    'PMAI_ANDROID_KEYSTORE', 'PMAI_ANDROID_KEY_ALIAS',
    'PMAI_ANDROID_STORE_PASSWORD', 'PMAI_ANDROID_KEY_PASSWORD'
].collectEntries { name -> [(name): System.getenv(name)] }
def hasReleaseSigning = releaseSigning.values().any { it }
def androidAbis = (System.getenv('ANDROID_ABIS') ?: 'arm64-v8a').tokenize()
if (hasReleaseSigning) {
    def missing = releaseSigning.findAll { name, value -> !value }.keySet()
    if (missing) {
        throw new GradleException("Release signing requires: ${missing.join(', ')}")
    }
}

def bundledIcon = layout.buildDirectory.dir('generated/ios-icon')
def syncIosIcon = tasks.register('syncIosIcon', Copy) {
    from rootProject.file('../PocketMai/Assets.xcassets/AppIcon.appiconset/icon-1024.png')
    into bundledIcon.map { it.dir('drawable-nodpi') }
    rename { 'ic_launcher.png' }
}

android {
    namespace 'org.mai.pocketmai'
    compileSdk 35
    sourceSets.main.res.srcDir bundledIcon
    // Use the same NDK as Swift so Gradle can strip packaged debug symbols.
    def ndkHome = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT')
    if (ndkHome) {
        ndkPath ndkHome
        ndkVersion new Properties().with { properties ->
            file("$ndkHome/source.properties").withInputStream { properties.load(it) }
            properties.getProperty('Pkg.Revision')
        }
    }
    defaultConfig {
        applicationId 'org.mai.pocketmai'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // Exclude leftover libraries for ABIs not rebuilt in this invocation.
        ndk { abiFilters(*androidAbis) }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseSigning.PMAI_ANDROID_KEYSTORE)
                storePassword releaseSigning.PMAI_ANDROID_STORE_PASSWORD
                keyAlias releaseSigning.PMAI_ANDROID_KEY_ALIAS
                keyPassword releaseSigning.PMAI_ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1'] }
    }
}

tasks.named('preBuild') { dependsOn syncIosIcon }

dependencies {
    implementation project(':composeui')
    implementation project(':androidbridge')
}
